services:
  - type: web
    name: bilaform-api-merab45
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    initialDeployHook: npm run db:migrate:savings-goals
    disk:
      name: bilaform-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: BILAFORM_DB_PATH
        value: /var/data/bilaform.db
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://merab45.github.io
      - key: PUBLIC_APP_URL
        value: https://merab45.github.io/BilaForm-Website/
